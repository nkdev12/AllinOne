# ============================================================================
# Production topology, and why nothing has a `ports:` mapping below Caddy.
#
# Caddy is the only entry point on the host (80/443/443-udp). MongoDB, Redis,
# MinIO, the API, Prometheus and Grafana are reachable on the `allinone-prod`
# network by service name only. Every one of them was published before, which
# put an unauthenticated replica set, an open Redis, the MinIO console and the
# Grafana admin UI on whatever address the host had — including the case where
# the whole stack moves behind a firewall and the operator assumes the leak is
# closed while the ports stay open.
#
# The API's own 3000 is the sharpest one, and it is not just "another port": the
# app runs `trust proxy 1` and `CustomThrottlerGuard` keys on `req.ip`, so a
# client that can reach :3000 directly — bypassing Caddy — controls
# `X-Forwarded-For` outright. Express then resolves whatever it is told, each
# forged value gets its own fresh rate-limit bucket, and every throttle in the
# application (login, OTP, vault unlock) is defeated by one header. Publishing
# :3000 makes the whole rate-limiting layer advisory.
#
# Consequences an operator has to plan for:
#   * Metrics and dashboards are internal. Prometheus reads `/metrics` from the
#     API over the network; to look at Grafana or Prometheus yourself, either add
#     a Caddy subdomain that reverse-proxies `grafana:3000` /
#     `prometheus:9090` (the Caddyfile has a commented block for exactly this) or
#     use `docker compose -f docker-compose.prod.yml exec` on the host.
#   * `mongosh` no longer works from the host either. Run it inside the network,
#     with a user, since the replica set now runs `--auth`:
#       docker compose -f docker-compose.prod.yml exec mongodb mongosh \
#         -u "$MONGO_ROOT_USERNAME" -p "$MONGO_ROOT_PASSWORD" \
#         --authenticationDatabase admin
#   * `prisma db push` has no home here. The `prisma` CLI is a devDependency and
#     the api image prunes dev dependencies before the final layer, so the
#     container cannot run it; the host has the CLI but no published database
#     port to point it at. `npx prisma` inside the container would fetch the CLI
#     over the network on every deploy — an unpinned download as part of a
#     production schema change, which is the wrong shape for a runbook. Pick one
#     deliberately (see "Apply the Prisma schema" in docs/DEPLOYMENT.md): a host
#     tunnel to `mongodb:27017`, or a one-off image that keeps dev dependencies.
#   * Every credential below is declared with compose's `:?` required-variable
#     form, so `docker compose config` fails on the spot instead of starting an
#     open service with an empty password. A missing secret is a deploy error,
#     never a default. The reference form is kept out of these comments because
#     compose interpolates the file as text: a worked example of the syntax here
#     would itself become a variable the deploy has to satisfy.
# ============================================================================

services:
  # ============================================================================
  # Caddy Reverse Proxy with automatic HTTPS (Let's Encrypt)
  # ============================================================================
  caddy:
    image: caddy:alpine
    container_name: allinone-caddy-prod
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data_prod:/data
      - caddy_config_prod:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - allinone-prod
    restart: unless-stopped
    environment:
      # Required: the Caddyfile's site block *is* this value, so an empty one
      # means Caddy serves a hostname nobody owns and Let's Encrypt never issued
      # for. The old `:-app.example.com` default was a working-looking config for
      # a domain that is not yours.
      DOMAIN: ${DOMAIN:?DOMAIN is required - the public hostname Caddy terminates TLS for}

  # ============================================================================
  # MongoDB Database (Production, replica set, authenticated)
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: allinone-mongodb-prod
    # `--auth` and `--keyFile` arrive together or not at all: mongod refuses to
    # start a replica set with authorization enabled and no internal authentication
    # mechanism, so `--auth` alone is a crash loop rather than a secured database.
    #
    # The image's own `MONGO_INITDB_ROOT_USERNAME`/`PASSWORD` pair is deliberately
    # NOT used here. It is only honoured while `/data/db` is empty, and it creates
    # that user against a standalone server before the replica set exists — the
    # documented behaviour is that the pair is effectively ignored once `--replSet`
    # is in the command. Creating the users is therefore the one-shot
    # `mongodb-bootstrap` service below.
    command:
      [
        "--replSet", "rs0",
        "--bind_ip_all",
        "--auth",
        "--keyFile", "/etc/mongo/keyfile",
      ]
    volumes:
      - mongo_data_prod:/data/db
      # Not a secret in the same sense as the passwords, but a leaked keyFile is a
      # forged replica-set member. `:?` so a missing path is a config error. The
      # steps that create it — `openssl rand -base64 756`, mode 600, owned by uid 999
      # or mongod refuses to start — are the header of
      # `deploy/mongo-replica-set-bootstrap.sh`.
      - ${MONGO_KEYFILE:?MONGO_KEYFILE is required - host path to the replica-set keyFile; see the header of deploy/mongo-replica-set-bootstrap.sh}:/etc/mongo/keyfile:ro
    healthcheck:
      # `ping` and nothing else. Before the bootstrap runs there is no user to
      # authenticate as, and after it runs `rs.status()` needs cluster authorisation
      # that this command does not hold — the previous healthcheck called
      # `rs.initiate()` itself, which also means it was the thing mutating the
      # replica set on a host that had just been secured.
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - allinone-prod
    restart: unless-stopped

  # ============================================================================
  # One-shot replica-set bootstrap: initiates `rs0`, then the two users
  # ============================================================================
  # Shares the mongod container's network namespace on purpose. With `--keyFile`
  # and no users yet, only a localhost connection gets the exception that allows
  # the first user to be created — a container reaching `mongodb:27017` over the
  # compose network would be refused before there is anything to authenticate with.
  mongodb-bootstrap:
    image: mongo:7.0
    container_name: allinone-mongodb-bootstrap
    depends_on:
      mongodb:
        condition: service_started
    network_mode: "service:mongodb"
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required - the replica-set admin created by the bootstrap}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required - its password}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?MONGO_APP_USERNAME is required - the user Prisma connects as}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required - only A-Z a-z 0-9 . _ ~ -, the bootstrap refuses anything else}
      DB_NAME: ${DB_NAME:-allinone_prod}
    volumes:
      - ./deploy:/bootstrap:ro
    entrypoint: ["/bin/sh", "/bootstrap/mongo-replica-set-bootstrap.sh"]
    # One shot, and `restart: "no"` is the point: it is idempotent, but a service
    # that loops against an already-initialised set is a service that hides the fact
    # that its own exit code was the alarm.
    restart: "no"

  # ============================================================================
  # Redis (Production, authenticated)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: allinone-redis-prod
    volumes:
      - redis_data_prod:/data
    environment:
      # The healthcheck reads it from the container's own environment. Spelling the
      # reference directly in `test:` would have compose interpolate it on the host
      # and bake the literal password into the healthcheck command, visible in
      # `docker inspect` output forever.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required - Redis requirepass}
    healthcheck:
      # Without `-a` an auth-required `ping` still answers (with NOAUTH) and exits
      # 0, so the old test reported a healthy service nobody could use. Grepping
      # for PONG is what makes it a real check.
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - allinone-prod
    restart: unless-stopped
    # Two additions, both about what Redis is *for* here. It holds exactly two
    # kinds of application state, and both are meant to be authoritative:
    #
    #   * the rate-limit counters (`src/common/throttler/redis-throttler.storage.ts`),
    #     keyed per client IP by `CustomThrottlerGuard`, so their cardinality is
    #     attacker-controlled — a brute force spread over enough source addresses
    #     multiplies keys rather than merely raising traffic, and unbounded memory
    #     makes that the host's problem;
    #   * the refresh-reuse records (`src/auth/refresh-token-grace.store.ts`), whose
    #     marker TTL is the refresh-token lifetime (`JWT_REFRESH_EXPIRATION`, `7d` in
    #     .env.example:93), so one long-lived active session that rotates a couple of
    #     times a day sits on the order of a hundred-odd keys until they expire.
    #
    # `--maxmemory 512mb` bounds both. `--maxmemory-policy noeviction` is the half
    # that is a security decision rather than a sizing one: every other policy
    # (allkeys-lru, volatile-lru, ...) relieves pressure by deleting keys, and here a
    # deleted key is a *successful* operation that returns no error — the counter
    # disappearing fails the limiter open silently, at exactly the moment somebody is
    # hammering login or OTP, and the grace/rotation marker disappearing erases the
    # only evidence that a token was ever rotated, which is what lets a replay be read
    # as theft instead of as an unknown credential. `noeviction` keeps the same
    # pressure but makes it a write error instead, and both consumers already report
    # that shape loudly: the throttler logs at error level ("Rate limiting is degraded
    # to this process only", once per 30s with the number of keys it has counted in
    # memory) and keeps the limit enforced per replica on its own window table, and
    # the grace store logs and refuses the replay rather than honouring it. Capacity
    # exhaustion becomes something the operator is told about, not a quiet security
    # regression that leaves every dashboard green.
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "512mb",
        "--maxmemory-policy",
        "noeviction",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD is required - Redis requirepass}",
      ]

  # ============================================================================
  # MinIO (S3-compatible object storage)
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: allinone-minio-prod
    environment:
      # Both required: MinIO treats a missing root pair as "no credentials set" and
      # serves unauthenticated on 9000 for the whole volume.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required - MinIO root user, at least 3 characters}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required - MinIO root password, at least 8 characters}
      MINIO_BROWSER: "on"
    volumes:
      - minio_data_prod:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - allinone-prod
    restart: unless-stopped

  # ============================================================================
  # Allinone API
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: allinone-api-prod
    environment:
      NODE_ENV: production
      APP_ENV: production
      APP_PORT: 3000
      APP_URL: ${APP_URL:?APP_URL is required - the public origin the app issues cookies and CORS for}
      # Credentials, and `replicaSet=rs0`. The driver needs the replica-set name in
      # the URI to use transactions at all, and it discovers members from the set
      # configuration — which is why the bootstrap publishes the member as
      # `mongodb:27017` and not `127.0.0.1:27017`, the address the previous
      # healthcheck initiated with.
      DATABASE_URL: mongodb://${MONGO_APP_USERNAME:?MONGO_APP_USERNAME is required}:${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}@mongodb:27017/${DB_NAME:-allinone_prod}?replicaSet=rs0&authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      # The three values `ConfigurationService.validateProductionSecrets()` refuses
      # if any of them is still the `.env.example` template. Required here so an
      # operator finds out from `docker compose config`, not from the crash loop.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required - generate with openssl rand -base64 48}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required - must differ from JWT_ACCESS_SECRET}
      # Also the vault pepper. Rotating it is a two-variable operation — set
      # ENCRYPTION_KEY_PREVIOUS to the retiring value first, change ENCRYPTION_KEY,
      # then clear the previous once every vault has unlocked. Left alone, these
      # blanks are the steady state (one pepper), which is why they use `:-` and
      # not `:?`. See `ConfigurationService.encryptionKey`.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required - it encrypts object-storage secrets and peppers every vault verifier}
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-}
      ENCRYPTION_KEY_PREVIOUS: ${ENCRYPTION_KEY_PREVIOUS:-}
      ENCRYPTION_KEY_PREVIOUS_ID: ${ENCRYPTION_KEY_PREVIOUS_ID:-}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      OBJECT_STORAGE_BUCKET: allinone-prod
      # Outgoing mail uses SMTP. `:-` rather than `:?` because its absence only
      # disables email delivery; it does not leave a partially working service.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-true}
      LOG_LEVEL: info
      LOG_FORMAT: json
      METRICS_ENABLED: "true"
    # No `ports:` — see the header. Caddy reaches `api:3000` on the internal
    # network, and the healthcheck below runs inside the container, so publishing
    # 3000 bought nothing except an unbypassable way to spoof `X-Forwarded-For`.
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - allinone-prod
    restart: unless-stopped

  # ============================================================================
  # Allinone Background Workers
  # ============================================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: allinone-worker-prod
    environment:
      NODE_ENV: production
      APP_ENV: production
      DATABASE_URL: mongodb://${MONGO_APP_USERNAME:?MONGO_APP_USERNAME is required}:${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}@mongodb:27017/${DB_NAME:-allinone_prod}?replicaSet=rs0&authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      # Required, not optional. `WorkerModule` runs its own Joi `validationSchema`
      # (`src/worker.module.ts:28-36`) over these three and `ConfigurationService`
      # re-checks `ENCRYPTION_KEY` in its constructor, so an unset one aborts the
      # process at boot — with `restart: unless-stopped` that is a crash-looping
      # replica rather than a degraded one. The worker mints no tokens and opens no
      # sessions, so it needs the values only to satisfy that shared validation.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      # Nothing in the worker reads the pepper ring — only `VaultSettingsService`
      # unlocks, and that is an API route. These are passed anyway so one `.env.prod`
      # produces one verdict: a half-open rotation window (a template, or repeated,
      # or colliding `ENCRYPTION_KEY_PREVIOUS`) fails both processes at boot instead
      # of leaving the replica running against a key the API has refused.
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-}
      ENCRYPTION_KEY_PREVIOUS: ${ENCRYPTION_KEY_PREVIOUS:-}
      ENCRYPTION_KEY_PREVIOUS_ID: ${ENCRYPTION_KEY_PREVIOUS_ID:-}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      OBJECT_STORAGE_BUCKET: allinone-prod
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-true}
      LOG_LEVEL: info
      LOG_FORMAT: json
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
    networks:
      - allinone-prod
    restart: unless-stopped
    deploy:
      replicas: 2

  # ============================================================================
  # Prometheus (Metrics)
  # ============================================================================
  prometheus:
    # Pinned, and deliberately on the LTS line rather than `latest`: a tag that
    # moves means a redeploy can pick up a server whose config parsing or query
    # behaviour differs from the one the dashboards were written against, and the
    # scrape credential below (`authorization.credentials_file`) needs >= 2.24,
    # which the 2.x images satisfied but which a `latest` nobody verified could
    # still walk past. v3.13.4 is the newest patch of the line prometheus.io
    # designates for extended support (checked against Docker Hub, and newer in
    # build date than the v3.15.0 feature release), so the config in
    # infrastructure/prometheus/prometheus.prod.yml is read by a server that is
    # still receiving fixes.
    image: prom/prometheus:v3.13.4
    container_name: allinone-prometheus-prod
    volumes:
      - ./infrastructure/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data_prod:/prometheus
      # The bearer credential the `allinone-api` job sends to `/metrics`. `:?` for
      # the same reason as every other credential in this file (see the header): a
      # scrape that cannot authenticate is monitoring nobody notices is missing, and
      # a deploy that starts without this file would produce exactly that — a
      # Prometheus up and healthy, every target 401. Making it a required variable
      # turns that into a config error at `docker compose config` time.
      #
      # The host file holds the ADMIN_SECRET value verbatim (no newline after it, no
      # `Bearer ` prefix — Prometheus adds that), is mode 600, and is never
      # committed: it is a path on the host, not a value in `.env.prod`, so it cannot
      # end up in the repository or in `docker inspect` output the way an inline
      # `credentials:` would. Read-only, because a metrics reader has no business
      # writing the credential it reads.
      - ${METRICS_SCRAPE_SECRET_FILE:?METRICS_SCRAPE_SECRET_FILE is required - host file holding ADMIN_SECRET, mounted into Prometheus for the /metrics scrape}:/run/secrets/metrics_scrape_secret:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
    # No `ports:`: `/api/v1/query` is unauthenticated by default, and a scrape
    # target list plus the whole metrics history is a reconnaissance report.
    networks:
      - allinone-prod
    restart: unless-stopped

  # ============================================================================
  # Grafana (Dashboards)
  # ============================================================================
  grafana:
    # Pinned for the same reason as Prometheus, and checked the same way: 13.2.4 is
    # a tag confirmed to exist on the registry and on the newest line still
    # receiving patch releases, so "we are on Grafana" is an answer the runbook can
    # give in version numbers rather than a date nobody recorded. `latest` here
    # meant a redeploy could cross a major silently and every hand-built dashboard
    # panel would move under the operator.
    #
    # What the pin does not settle: `GF_INSTALL_PLUGINS` below still names
    # `grafana-piechart-panel`, which the in-core pie chart panel superseded. Whether
    # that plugin loads on 13.x was not verified from here, and it is the first thing
    # to check before this number moves again.
    image: grafana/grafana:13.2.4
    container_name: allinone-grafana-prod
    environment:
      # Required: with `GF_SECURITY_ADMIN_PASSWORD` empty, Grafana falls back to
      # `admin`/`admin`, which on a published 3001 was a guessing game with a
      # Prometheus data source attached to it.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required - Grafana admin login}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_SERVER_ROOT_URL: https://${DOMAIN:?DOMAIN is required}/grafana
      GF_SECURITY_ALLOW_EMBED_INITIATE_LOGIN: "true"
    volumes:
      - grafana_data_prod:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started
    # No `ports:` — reachable through a Caddy reverse proxy only, so the admin UI
    # gets the same TLS and origin allow-list as the API.
    networks:
      - allinone-prod
    restart: unless-stopped

volumes:
  mongo_data_prod:
  redis_data_prod:
  minio_data_prod:
  prometheus_data_prod:
  grafana_data_prod:
  caddy_data_prod:
  caddy_config_prod:

networks:
  allinone-prod:
    driver: bridge
