version: '3.8'

services:
  # ============================================================================
  # Caddy Reverse Proxy with automatic HTTPS (Let's Encrypt)
  # ============================================================================
  caddy:
    image: caddy:alpine
    container_name: allinone-caddy-prod
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data_prod:/data
      - caddy_config_prod:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - allinone-prod
    restart: unless-stopped
    environment:
      DOMAIN=${DOMAIN:-app.example.com}

  # ============================================================================
android   # MongoDB Database (Production)
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: allinone-mongodb-prod
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_prod:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - allinone-prod
    restart: unless-stopped

  # ============================================================================
  # Redis (Production)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: allinone-redis-prod
    ports:
      - "6379:6379"
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - allinone-prod
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}

  # ============================================================================
  # MinIO (S3-compatible object storage)
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: allinone-minio-prod
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER: "on"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data_prod:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - allinone-prod
    restart: unless-stopped

  # ============================================================================
  # Allinone API
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: allinone-api-prod
    environment:
      NODE_ENV: production
      APP_ENV: production
      APP_PORT: 3000
      APP_URL: ${APP_URL}
      DATABASE_URL: mongodb://mongodb:27017/${DB_NAME:-allinone_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      OBJECT_STORAGE_BUCKET: allinone-prod
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_TLS: ${SMTP_TLS:-true}
      LOG_LEVEL: info
      LOG_FORMAT: json
      METRICS_ENABLED: "true"
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - allinone-prod
    restart: unless-stopped

  # ============================================================================
  # Allinone Background Workers
  # ============================================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: allinone-worker-prod
    environment:
      NODE_ENV: production
      APP_ENV: production
      DATABASE_URL: mongodb://mongodb:27017/${DB_NAME:-allinone_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      OBJECT_STORAGE_BUCKET: allinone-prod
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      LOG_LEVEL: info
      LOG_FORMAT: json
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
    networks:
      - allinone-prod
    restart: unless-stopped
    deploy:
      replicas: 2

  # ============================================================================
  # Prometheus (Metrics)
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: allinone-prometheus-prod
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data_prod:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
    networks:
      - allinone-prod
    restart: unless-stopped

  # ============================================================================
  # Grafana (Dashboards)
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: allinone-grafana-prod
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_SERVER_ROOT_URL: https://${DOMAIN:-app.example.com}/grafana
      GF_SECURITY_ALLOW_EMBED_INITIATE_LOGIN: "true"
    volumes:
      - grafana_data_prod:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - allinone-prod
    restart: unless-stopped

volumes:
  mongo_data_prod:
  redis_data_prod:
  minio_data_prod:
  prometheus_data_prod:
  grafana_data_prod:
  caddy_data_prod:
  caddy_config_prod:

networks:
  allinone-prod:
    driver: bridge
