version: '3.8'

# ============================================================================
# Development dependencies only. Nothing in this file is the deployment.
#
# The API and the queue worker run on the host (`npm run start:dev`,
# `npm run start:worker`); the deployed topology is two Railway services built by
# Nixpacks from `railway.json` / `railway.worker.json`, on managed Atlas MongoDB
# and managed Redis. That means the services below stand in for things that are
# managed elsewhere: `mongodb` for Atlas, `redis` for Upstash, `minio` for the S3
# bucket, `mailpit` for Gmail SMTP, and `prometheus`/`grafana` for the monitoring
# stack that has no production counterpart any more.
#
# Docker is not required to develop against a real Atlas/Upstash pair either —
# point DATABASE_URL and REDIS_URL at them and start nothing here.
# ============================================================================

services:
  # ============================================================================
  # MongoDB Database
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: allinone-mongodb-dev
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_dev:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - allinone-dev

  # ============================================================================
  # Redis Cache & Queue
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: allinone-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - allinone-dev

  # ============================================================================
  # MinIO (S3-compatible object storage)
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: allinone-minio-dev
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data_dev:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - allinone-dev

  # ============================================================================
  # Mailpit (Development email testing - replaces paid email services)
  # ============================================================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: allinone-mailpit-dev
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    volumes:
      - mailpit_data_dev:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8025/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - allinone-dev

  # ============================================================================
  # Prometheus (Metrics — DEV ONLY; there is no production scraper any more)
  #
  # This stack is now the only place Prometheus and Grafana are started at all:
  # the production compose file, its Caddyfront and `prometheus.prod.yml` were
  # deleted in 1c1cc7d, and Railway runs neither. `infrastructure/grafana/**`
  # survives only because it is mounted here.
  # ============================================================================
  prometheus:
    # Pinned rather than `latest` so the version is a number somebody checked: the
    # scrape stanza in infrastructure/prometheus/prometheus.dev.yml is written
    # against `authorization.credentials_file` (Prometheus >= 2.24) and the
    # alternative `http_headers` form against >= 2.53.
    image: prom/prometheus:v3.13.4
    container_name: allinone-prometheus-dev
    ports:
      - "9090:9090"
    # The API's scrape target is `host.docker.internal:3000` — the API is not a
    # service in this file, it runs on the host (`npm run start:dev`). Docker
    # Desktop maps that name already; on Linux Docker it only resolves with this
    # line, so without it the one dev dashboard that exists reports `up 0` for a
    # reason that has nothing to do with credentials.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infrastructure/prometheus/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      # An operator who wants dev metrics to authenticate supplies their own file
      # holding ADMIN_SECRET verbatim (mode 600, never committed) and uncomments
      # both this mount and the `authorization` stanza in that config.
      # - /run/secrets/metrics_scrape_secret:/run/secrets/metrics_scrape_secret:ro
      - prometheus_data_dev:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - allinone-dev

  # ============================================================================
  # Grafana (Visualization — DEV ONLY, same reason as above)
  # ============================================================================
  grafana:
    image: grafana/grafana:13.2.4
    container_name: allinone-grafana-dev
    ports:
      - "3001:3000"
    environment:
      # Local-only credentials for a dashboard nobody outside this machine can
      # reach. They are here because the dev stack has to start without prompting;
      # change them if you expose 3001 anywhere.
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data_dev:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - allinone-dev

volumes:
  mongo_data_dev:
  redis_data_dev:
  minio_data_dev:
  mailpit_data_dev:
  prometheus_data_dev:
  grafana_data_dev:

networks:
  allinone-dev:
    driver: bridge
