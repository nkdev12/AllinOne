version: '3.8'

services:
  # ============================================================================
  # MongoDB Database
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: allinone-mongodb-dev
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_dev:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - allinone-dev

  # ============================================================================
  # Redis Cache & Queue
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: allinone-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - allinone-dev

  # ============================================================================
  # MinIO (S3-compatible object storage)
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: allinone-minio-dev
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data_dev:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - allinone-dev

  # ============================================================================
  # Mailpit (Development email testing - replaces paid email services)
  # ============================================================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: allinone-mailpit-dev
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    volumes:
      - mailpit_data_dev:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8025/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - allinone-dev

  # ============================================================================
  # Prometheus (Metrics - open-source monitoring)
  # ============================================================================
  prometheus:
    # Same pin as docker-compose.prod.yml, same reason in miniature: `latest` made
    # the version a function of when an image was last pulled, and the commented
    # scrape-credential stanza in infrastructure/prometheus/prometheus.dev.yml is
    # written against `authorization.credentials_file` (Prometheus >= 2.24), so the
    # tag has to be a number someone checked rather than a moving target.
    #
    # No credentials mount here on purpose. The file it would mount holds
    # ADMIN_SECRET, which is a production value; a dev compose everybody clones
    # cannot ship it and must not invent a committed placeholder for it. Until an
    # operator supplies their own and uncomments the stanza in that config, these
    # scrapes answer 401 — documented there, not silent.
    image: prom/prometheus:v3.13.4
    container_name: allinone-prometheus-dev
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data_dev:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - allinone-dev

  # ============================================================================
  # Grafana (Visualization - open-source dashboards)
  # ============================================================================
  grafana:
    # Pinned to the same tag as production so a panel built on a laptop means the
    # same thing on the server; the version was confirmed against the registry, not
    # guessed. See the note on the production service about the deprecated
    # `grafana-piechart-panel` in `GF_INSTALL_PLUGINS` before this moves again.
    image: grafana/grafana:13.2.4
    container_name: allinone-grafana-dev
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data_dev:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - allinone-dev

volumes:
  mongo_data_dev:
  redis_data_dev:
  minio_data_dev:
  mailpit_data_dev:
  prometheus_data_dev:
  grafana_data_dev:

networks:
  allinone-dev:
    driver: bridge
