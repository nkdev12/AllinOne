global:
  scrape_interval: 30s
  evaluation_interval: 30s
  retention: 90d

scrape_configs:
  - job_name: 'allinone-api'
    static_configs:
      - targets: ['api:3000']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
